name: Build ARF-Shuka-Edition

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '**.md'
  workflow_dispatch: {}

jobs:
  test:
    name: Crypto unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile & run crypto test vectors
        run: |
          cd tests
          echo "== AUT64 block cipher =="
          gcc -I.. -O2 -Wall -Werror -o test_aut64 test_aut64.c ../new_files/aut64.c
          ./test_aut64
          echo "== KeeLoq rolling code =="
          gcc -I.. -O2 -Wall -Werror -o test_keeloq test_keeloq.c
          ./test_keeloq

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout ARF-Shuka-Edition
        uses: actions/checkout@v4
        with:
          path: shuka-edition

      - name: Clone Flipper-ARF base firmware (shallow)
        run: |
          ARF_TAG=$(cat shuka-edition/ARF_VERSION 2>/dev/null | tr -d '[:space:]')
          if [ -n "$ARF_TAG" ]; then
            echo "Cloning ARF tag: $ARF_TAG"
            git clone --depth 1 --branch "$ARF_TAG" \
              https://github.com/D4C1-Labs/Flipper-ARF.git flipper-fw
          else
            echo "No ARF_VERSION found — cloning latest HEAD"
            git clone --depth 1 https://github.com/D4C1-Labs/Flipper-ARF.git flipper-fw
          fi
          cd flipper-fw
          git submodule update --init --recursive --depth 1
          echo "ARF_TAG=${ARF_TAG:-HEAD}" >> "$GITHUB_ENV"

      - name: Stamp version string
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          cd flipper-fw
          # fbt reads `git describe --tags --always` to build the string shown
          # in Settings → About. Tag HEAD so it shows our name instead of ARF's.
          GIT_COMMITTER_NAME="shuka0158" \
          GIT_COMMITTER_EMAIL="noreply@github.com" \
          git tag "ARF-Shuka-Edition"
          git describe --tags --always

      - name: Add missing apps from official Flipper firmware
        run: |
          # Only add apps that are truly absent from ARF — never overwrite ARF's own
          # version, because system FAPs (like cli_ikey) may depend on ARF's API.
          CORE_APPS="applications/main/infrared applications/main/ibutton applications/main/bad_usb applications/main/u2f"
          NEED=""
          for app in infrared ibutton bad_usb u2f; do
            if [ ! -d "flipper-fw/applications/main/${app}" ]; then
              NEED="$NEED applications/main/${app}"
              echo "  missing: ${app} — will add from official firmware"
            else
              echo "  present: ${app} — keeping ARF's version"
            fi
          done
          if [ -n "$NEED" ]; then
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/flipperdevices/flipperzero-firmware.git flipper-official
            cd flipper-official
            git sparse-checkout set $NEED
            cd ..
            for app in infrared ibutton bad_usb u2f; do
              dest="flipper-fw/applications/main/${app}"
              src="flipper-official/applications/main/${app}"
              if [ ! -d "$dest" ] && [ -d "$src" ]; then
                cp -r "$src" "$dest"
                echo "  added: ${app}"
              fi
            done
            rm -rf flipper-official
          fi
          echo "Core apps patched OK"

      - name: Apply Shuka-Edition modified files
        run: |
          REPO=flipper-fw
          SHUKA=shuka-edition

          # Overlay every file in modified_files/ at the same relative path inside the ARF clone
          find $SHUKA/modified_files -type f | while read src; do
            relative="${src#$SHUKA/modified_files/}"
            dest="$REPO/$relative"
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
            echo "  patched: $relative"
          done
          echo "Modified files applied"

      - name: Apply verified PSA decoder fixes
        run: |
          # psa.c already exists in upstream ARF, so it can't go through
          # modified_files/ (that would silently revert future upstream
          # changes) — patch the two verified bugs in place instead.
          python3 shuka-edition/scripts/patch_psa_decoder.py

      - name: Customize firmware branding
        run: |
          # Replace "ARF-Firmware" firmware name with "Shuka-ARF" in all source files
          grep -rl "ARF-Firmware" flipper-fw/ \
            --include="*.c" --include="*.h" --include="*.py" --include="*.scons" \
            2>/dev/null | xargs -r sed -i 's/ARF-Firmware/Shuka-ARF/g'
          echo "Firmware name patched"

          # Patch about.c to add attribution lines
          python3 shuka-edition/scripts/patch_about.py

      - name: Strip low-coverage ARF protocols to recover flash space
        run: |
          PROTO=flipper-fw/lib/subghz/protocols

          # Remove 3rd-party system FAPs that use official-only APIs absent in ARF's SDK.
          # 1) Grep-based: symbols/headers ARF removed (catches ir_remote, xremote, etc.)
          BROKEN=$(grep -rl \
            "InfraredSettings\|FuriHalInfraredTxPin\|furi_hal_infrared_set_tx_output\|INFRARED_SETTINGS_PATH\|furi_hal_infrared_detect_tx_output\|ibutton/ibutton_key\.h" \
            flipper-fw/applications/system/ --include="*.c" --include="*.h" 2>/dev/null \
            | sed "s|flipper-fw/applications/system/||" | cut -d/ -f1 | sort -u)
          for app in $BROKEN; do
            rm -rf "flipper-fw/applications/system/${app}"
            echo "  removed incompatible system FAP: ${app}"
          done
          # 2) Find FAPs by appid in their .fam file and surgically remove them.
          #    cli_ikey builds ibutton_cli.c which needs ibutton_key.h (missing in ARF SDK).
          #    IMPORTANT: only delete the .fam + the broken source files, NOT the whole
          #    directory — cli_ikey lives inside applications/main/ibutton which also
          #    contains the main iButton GUI app (a menu entry).  rm -rf the dir kills iButton.
          for appid in cli_ikey; do
            FAM=$(grep -rl "\"${appid}\"" flipper-fw/applications/ --include="*.fam" 2>/dev/null | head -1)
            if [ -n "$FAM" ]; then
              FAP_DIR=$(dirname "$FAM")
              rm -f "$FAM"
              echo "  removed .fam for '${appid}': $FAM"
              # Remove any source files in the same dir that pull in the incompatible header
              while IFS= read -r src; do
                [ -n "$src" ] || continue
                rm -f "$src"
                echo "  removed incompatible source: $(basename "$src")"
              done < <(grep -rl "ibutton_key\.h" "$FAP_DIR" --include="*.c" --include="*.h" 2>/dev/null || true)
            else
              echo "  FAP '${appid}' not found — skipping"
            fi
          done
          echo "System FAP cleanup done"

          # Remove Russian aftermarket protocols — regional, rarely encountered outside RU.
          # Scher-Khan (37 KB src), Sheriff CFM (23 KB src), Star Line (42 KB src)
          # together account for ~4–6 KB of compiled flash.
          for proto in scher_khan sheriff_cfm star_line; do
            rm -f $PROTO/${proto}.c $PROTO/${proto}.h
            sed -i "/#include \"${proto}.h\"/d"          $PROTO/protocol_items.h
            sed -i "/subghz_protocol_${proto},/d"        $PROTO/protocol_items.c
            echo "Stripped: $proto"
          done

          # Round 4 cut (issue #9 flash budget): Kia alone shipped 7 active
          # protocol variants (kia_v0..kia_v7, skipping v4) — unusual
          # redundancy for one brand. Keep the newest three (v5/v6/v7, likely
          # covering current-generation vehicles still on the road) and cut
          # the four oldest. kia_generic.h (shared helpers) stays — v5/v6/v7
          # still use it.
          for proto in kia_v0 kia_v1 kia_v2 kia_v3_v4; do
            rm -f $PROTO/${proto}.c $PROTO/${proto}.h
            sed -i "/#include \"${proto}.h\"/d"   $PROTO/protocol_items.h
            sed -i "/&subghz_protocol_${proto},/d" $PROTO/protocol_items.c
            echo "Stripped: $proto"
          done

          # Re-enable ALL standard SubGHz protocols that ARF comments out.
          # ARF strips non-automotive protocols to save flash; we restore full coverage.
          # Exact names taken from ARF protocol_items.c //&subghz_protocol_<name>, lines.
          PROTO_ITEMS=flipper-fw/lib/subghz/protocols/protocol_items.c
          # Cut list (too obscure / regional / non-automotive to justify the flash cost):
          #   dickert_mahs elplast feron gangqi hay21 hollarm
          #   ido keyfinder nero_radio nero_sketch power_smart
          #   revers_rb2 roger treadmill37
          # Also cut: holtek_th12x (variant of holtek), marantec24 (variant of marantec),
          #   honeywell_wdb (doorbell variant), beninca_arc, legrand — saves ~10 KB.
          # Non-automotive home-automation cut (flash space for new vehicle protocols):
          #   dooya      — Chinese motorized blinds/fans/curtains, not gates
          #   intertechno_v3 — smart home lighting switches/dimmers, zero automotive use
          #   jarolift   — German motorized blinds, not automotive
          #   doitrand   — niche regional French gate brand
          #   chamb_code — old Chamberlain fixed code; secplus_v1/v2 covers all modern units
          #   ansonic    — generic RF largely overlapping princeton/gate_tx
          # Round 2 cut (865 KB still 5 KB over 860 KB C2 boundary):
          #   somfy_keytis, somfy_telis — shutter/awning remotes, same "not automotive"
          #     category as dooya/jarolift above, should have been cut with them
          #   bett, clemsa, kinggates_stylo_4k, magellan, mastercode, phoenix_v2 —
          #     niche regional gate brands with low real-world encounter rate,
          #     overlapping coverage from princeton/gate_tx/came/nice generics
          # Round 3 cut (issue #9 — real C2 boundary is 824 KB, not 860 KB; still
          #   ~32 KB over): drop the rest of the generic garage/gate/alarm batch
          #   this step re-enables — alutech_at_4n, faac_slh, gate_tx, holtek,
          #   honeywell (wireless alarm sensor, not automotive at all), hormann,
          #   linear/linear_delta3, marantec, megacode, secplus_v1/v2, smc5326.
          #   Kept: princeton, came/came_atomo/came_twee, nice_flo/nice_flor_s —
          #   widest real-world gate/garage coverage per KB of the batch — plus
          #   toyota, which is automotive.
          for proto in \
            came came_atomo came_twee \
            nice_flo nice_flor_s \
            princeton \
            toyota; do
            if grep -q "//&subghz_protocol_${proto}," "$PROTO_ITEMS"; then
              sed -i -E "s|//(&subghz_protocol_${proto},)|\1|" "$PROTO_ITEMS"
              echo "  uncommented: ${proto}"
            else
              echo "  note: ${proto} not found commented-out (already active or renamed)"
            fi
          done
          ENABLED=$(grep -c "^\s*&subghz_protocol_" "$PROTO_ITEMS" || true)
          echo "Total active protocol entries: ${ENABLED}"

      - name: Strip Mifare DESFire support (issue #9 flash budget)
        run: |
          # ~9 KB of firmware.dfu. Unlike SubGHz protocols (a simple array),
          # DESFire is woven into shared NFC library code (Type 4 Tag) and
          # several apps, so this is exact-text/structured surgery rather
          # than a blanket file/line removal. See issue #9 for the full
          # writeup of why this was needed and what was checked.
          REPO=flipper-fw
          SHUKA=shuka-edition

          # SDK public-API export table (the same file issue #8's CI guard
          # reads): scons cross-checks every `Header,+,<path>` row against a
          # real file on disk independent of whether anything still
          # #includes it, so a deleted-but-still-listed header is a hard
          # build failure ("Source ... not found"), not just dead metadata.
          # Also drop the exported mf_desfire_* functions/variable — leaving
          # them would export symbols for a library that no longer exists.
          sed -i '/desfire/Id' "$REPO/targets/f7/api_symbols.csv"

          # ── Core protocol library ──
          rm -rf "$REPO/lib/nfc/protocols/mf_desfire"

          NFC_DEVICE_DEFS=$REPO/lib/nfc/protocols/nfc_device_defs.c
          sed -i '/#include <nfc\/protocols\/mf_desfire\/mf_desfire.h>/d' "$NFC_DEVICE_DEFS"
          sed -i '/\[NfcProtocolMfDesfire\] = &nfc_device_mf_desfire,/d'  "$NFC_DEVICE_DEFS"

          NFC_POLLER_DEFS=$REPO/lib/nfc/protocols/nfc_poller_defs.c
          sed -i '/#include <nfc\/protocols\/mf_desfire\/mf_desfire_poller_defs.h>/d' "$NFC_POLLER_DEFS"
          sed -i '/\[NfcProtocolMfDesfire\] = &mf_desfire_poller,/d'                  "$NFC_POLLER_DEFS"

          # Critical for crash safety: without this, the NFC scanner's normal
          # auto-detect loop (which runs on every card scan, not just DESFire
          # ones) would still try NfcProtocolMfDesfire as a child of
          # ISO14443-4A and dereference the now-missing poller/device table
          # entries. NfcProtocolMfDesfire stays defined in the enum (unused,
          # harmless) — only removing it as a *candidate* to auto-detect.
          sed -i '/^    NfcProtocolMfDesfire,$/d' "$REPO/lib/nfc/protocols/nfc_protocol.c"

          # lib/nfc's own SConscript explicitly lists every public header via
          # File(...) (not a glob), for the firmware's SDK export table. This
          # is the actual root cause of the "sdk_origin.i ... Source ...
          # mf_desfire.h not found" build failure: unlike a glob, an explicit
          # File() node doesn't just quietly stop matching when the file goes
          # away — scons still expects it to exist and hard-fails resolving
          # the build graph. Deleting api_symbols.csv's rows earlier does NOT
          # fix this; that CSV is a separate cached snapshot, not what's read
          # here.
          sed -i '/File("protocols\/mf_desfire\/mf_desfire.h"),/d' "$REPO/lib/nfc/SConscript"
          sed -i '/File("protocols\/mf_desfire\/mf_desfire_poller.h"),/d' "$REPO/lib/nfc/SConscript"

          python3 "$SHUKA/scripts/patch_type_4_tag_no_desfire.py" \
            "$REPO/lib/nfc/protocols/type_4_tag/type_4_tag_poller_i.c"

          # ── Main NFC app: dedicated DESFire scene/plugin/CLI files ──
          NFC=$REPO/applications/main/nfc
          rm -rf "$NFC/helpers/protocol_support/mf_desfire"
          rm -rf "$NFC/cli/commands/dump/protocols/mf_desfire"
          rm -f "$NFC/scenes/nfc_scene_mf_desfire_app.c"
          rm -f "$NFC/scenes/nfc_scene_mf_desfire_more_info.c"
          # DESFire-only transit-card plugins — can't function without it.
          rm -f "$NFC/plugins/supported_cards/clipper.c"
          rm -f "$NFC/plugins/supported_cards/itso.c"
          rm -f "$NFC/plugins/supported_cards/myki.c"
          rm -f "$NFC/plugins/supported_cards/opal.c"

          sed -i '/cli\/commands\/dump\/protocols\/mf_desfire\/nfc_cli_dump_mf_desfire.c/d' \
            "$NFC/application.fam"
          python3 "$SHUKA/scripts/remove_fam_apps.py" "$NFC/application.fam" \
            nfc_mf_desfire opal_parser myki_parser clipper_parser itso_parser

          sed -i '/#include "protocols\/mf_desfire\/nfc_cli_dump_mf_desfire.h"/d' \
            "$NFC/cli/commands/dump/nfc_cli_command_dump.c"
          sed -i '/\[NfcProtocolMfDesfire\] = nfc_cli_dump_poller_callback_mf_desfire,/d' \
            "$NFC/cli/commands/dump/nfc_cli_command_dump.c"
          sed -i '/{\.name = "des", \.value = NfcProtocolMfDesfire},/d' \
            "$NFC/cli/commands/dump/nfc_cli_command_dump.c"
          sed -i '/\[NfcProtocolMfDesfire\] = "Mifare DESFire",/d' \
            "$NFC/cli/commands/helpers/nfc_cli_format.c"
          sed -i '/\[NfcProtocolMfDesfire\] = "mf_desfire",/d' \
            "$NFC/helpers/protocol_support/nfc_protocol_support.c"
          sed -i '/ADD_SCENE(nfc, mf_desfire_more_info, MfDesfireMoreInfo)/d' \
            "$NFC/scenes/nfc_scene_config.h"
          sed -i '/ADD_SCENE(nfc, mf_desfire_app, MfDesfireApp)/d' \
            "$NFC/scenes/nfc_scene_config.h"

          # ── Metroflip: its own DESFire scene glue + transit-card plugins ──
          METROFLIP=$REPO/applications/system/metroflip
          rm -f "$METROFLIP/scenes/desfire.c" "$METROFLIP/scenes/desfire.h"
          rm -f "$METROFLIP/scenes/plugins/clipper.c"
          rm -f "$METROFLIP/scenes/plugins/itso.c"
          rm -f "$METROFLIP/scenes/plugins/myki.c"
          rm -f "$METROFLIP/scenes/plugins/nol.c"
          rm -f "$METROFLIP/scenes/plugins/opal.c"
          python3 "$SHUKA/scripts/patch_metroflip_no_desfire.py" "$METROFLIP"
          python3 "$SHUKA/scripts/remove_fam_apps.py" "$METROFLIP/application.fam" \
            clipper_plugin itso_plugin myki_plugin opal_plugin nol_plugin

          echo "DESFire support stripped."

      - name: Add Shuka-Edition protocols on top of ARF
        run: |
          REPO=flipper-fw
          SHUKA=shuka-edition
          PROTO=$REPO/lib/subghz/protocols

          # ── Unique protocols not in upstream ARF ──────────────────────────
          # GM Rolling (GM/Chevrolet/Buick/Cadillac rolling-code RKE)
          cp $SHUKA/new_files/gm_rolling.c   $PROTO/
          cp $SHUKA/new_files/gm_rolling.h   $PROTO/

          # Nissan (Nissan/Infiniti RKE)
          cp $SHUKA/new_files/nissan.c       $PROTO/
          cp $SHUKA/new_files/nissan.h       $PROTO/

          # Renault/Dacia RKE
          cp $SHUKA/new_files/renault.c      $PROTO/
          cp $SHUKA/new_files/renault.h      $PROTO/

          # toyota_lexus — modern Toyota/Lexus 2003-2020 (72-bit PWM + CRC-8)
          # ARF's toyota.c covers older Corolla Verso/Tundra dual-variant — both coexist
          cp $SHUKA/new_files/toyota_lexus.c $PROTO/
          cp $SHUKA/new_files/toyota_lexus.h $PROTO/

          # Honda/Acura rolling-code RKE (2007+, 315/433 MHz, CRC-8 poly 0x2F)
          cp $SHUKA/new_files/honda_acura.c  $PROTO/
          cp $SHUKA/new_files/honda_acura.h  $PROTO/

          # Hyundai New RKE (2017+ Hyundai/Genesis, 433 MHz, CRC-8 poly 0x31)
          cp $SHUKA/new_files/hyundai_new.c  $PROTO/
          cp $SHUKA/new_files/hyundai_new.h  $PROTO/

          # X10 home automation protocol (310 MHz AM, 32-bit with inverted byte validation)
          # Only add if not already present in ARF
          if ! grep -q '#include "x10.h"' $PROTO/protocol_items.h 2>/dev/null; then
            cp $SHUKA/new_files/x10.c $PROTO/
            cp $SHUKA/new_files/x10.h $PROTO/
            echo "  x10 protocol will be registered"
          else
            echo "  x10 already in ARF — skipping copy"
          fi

          # ── Patch protocol_items.h — add our includes after toyota.h ─────
          if ! grep -q '#include "toyota.h"' $PROTO/protocol_items.h; then
            echo "ERROR: toyota.h include not found in protocol_items.h — ARF changed its layout" >&2
            exit 1
          fi
          sed -i \
            's|#include "toyota.h"|#include "toyota.h"\n#include "gm_rolling.h"\n#include "nissan.h"\n#include "renault.h"\n#include "toyota_lexus.h"\n#include "honda_acura.h"\n#include "hyundai_new.h"|' \
            $PROTO/protocol_items.h
          grep -q '#include "gm_rolling.h"' $PROTO/protocol_items.h || { echo "ERROR: header patch failed" >&2; exit 1; }
          # Add x10 include if not already present
          if [ -f "$PROTO/x10.h" ] && ! grep -q '#include "x10.h"' $PROTO/protocol_items.h; then
            sed -i 's|#include "hyundai_new.h"|#include "hyundai_new.h"\n#include "x10.h"|' $PROTO/protocol_items.h
            echo "  x10 include added"
          fi

          # ── Patch protocol_items.c — add entries after &subghz_protocol_toyota ─
          if ! grep -q 'subghz_protocol_toyota,$' $PROTO/protocol_items.c; then
            echo "ERROR: subghz_protocol_toyota entry not found in protocol_items.c — ARF changed its layout" >&2
            exit 1
          fi
          sed -i '/subghz_protocol_toyota,$/a\    \&subghz_protocol_toyota_lexus,\n    \&subghz_protocol_gm_rolling,\n    \&subghz_protocol_nissan,\n    \&subghz_protocol_renault,\n    \&subghz_protocol_honda_acura,\n    \&subghz_protocol_hyundai_new,' \
            $PROTO/protocol_items.c
          grep -q 'subghz_protocol_gm_rolling' $PROTO/protocol_items.c || { echo "ERROR: protocol_items.c patch failed" >&2; exit 1; }
          # Add x10 entry if not already present
          if [ -f "$PROTO/x10.c" ] && ! grep -q 'subghz_protocol_x10,' $PROTO/protocol_items.c; then
            sed -i '/subghz_protocol_hyundai_new,$/a\    \&subghz_protocol_x10,' $PROTO/protocol_items.c
            echo "  x10 protocol registered"
          fi

          echo "All Shuka-Edition protocols added OK"

      - name: Add SubGHz RX LED toggle
        run: |
          # Lets the user disable the LED indicator while in SubGHz Read
          # mode (covert reads / battery save) without touching the vibro,
          # beep, or backlight feedback on a captured signal. Defaults ON —
          # existing behavior is unchanged unless the user opts out.
          python3 shuka-edition/scripts/patch_subghz_rx_led_toggle.py flipper-fw

      - name: Remove vgm_console (bundled FlipperHTTP networking)
        run: |
          # video_game_module_console is fully self-contained (own directory,
          # own App() entry, nothing else references it or its bundled
          # flipper_http.c/h helper) — plain rm -rf is sufficient, no
          # registry/menu list to edit elsewhere.
          rm -rf flipper-fw/applications/system/vgm_console

      - name: Apply custom boot splash
        run: |
          REPO=flipper-fw
          SHUKA=shuka-edition

          # Replace ARF's slideshow frames with our branded ones
          cp $SHUKA/new_files/assets/slideshow/update_default/frame_*.png \
             $REPO/assets/slideshow/update_default/
          cp $SHUKA/new_files/assets/slideshow/first_start/frame_*.png \
             $REPO/assets/slideshow/first_start/
          echo "Boot splash applied"

      - name: Preset Dolphin XP to max level
        run: |
          python3 shuka-edition/scripts/patch_dolphin_level.py

      - name: Set up Python & fbt toolchain
        run: |
          sudo apt-get install -y python3-pip scons gcc-arm-none-eabi
          cd flipper-fw
          python3 -m pip install --upgrade pip
          pip3 install pyserial protobuf heatshrink2

      - name: Embed custom animations into firmware resources
        run: |
          pip3 install -q Pillow
          EXTERN=flipper-fw/assets/dolphin/external

          # Remove ARF's stock external animations — only our 4 will remain
          rm -rf "${EXTERN:?}"/*

          # Generate directly into the dolphin external path fbt expects.
          # DolphinExtBuilder packs this folder into resources.ths → deployed to
          # /int/dolphin/ during OTA install, so no SD card required.
          python3 shuka-edition/scripts/generate_animations.py "$EXTERN"

          echo "Custom animations embedded:"
          ls -la "$EXTERN/"
          echo "Manifest:"
          cat "$EXTERN/manifest.txt"

          # Also zip for the GitHub Release — users can copy to SD card too
          mkdir -p artifacts_anim
          cp -r "$EXTERN/" artifacts_anim/ARF-Shuka-animations
          (cd artifacts_anim && zip -r ARF-Shuka-animations.zip ARF-Shuka-animations/ -x "*.DS_Store")
          echo "Animation SD pack built."
        env:
          PYTHONUNBUFFERED: "1"



      - name: Build firmware
        run: |
          cd flipper-fw
          ./fbt COMPACT=1 DEBUG=0 \
            DIST_SUFFIX="arf-shuka-edition" \
            updater_package 2>&1 | tee build.log
          FBT_STATUS="${PIPESTATUS[0]}"

          # `find dist -name "*.dfu"` alone is not a reliable success signal: an
          # earlier, unrelated build stage can leave a .dfu on disk even when the
          # actual `dist_updater_package` target (which assembles the real OTA
          # bundle — firmware.dfu + resources.ths + update.fuf) fails partway
          # through. This bit us for real: fbt's own memory-layout guard
          # ("Firmware image overlaps C2 region and is not programmable!") was
          # failing on every build without anyone noticing, because this step
          # only checked for *a* .dfu file rather than the actual exit status of
          # the fbt invocation that was supposed to build the whole package.
          if [ "$FBT_STATUS" -ne 0 ] || grep -q "FBT ERRORS" build.log; then
            echo "Build FAILED — fbt exited $FBT_STATUS or reported FBT ERRORS" >&2
            tail -60 build.log >&2
            exit 1
          fi

          if find dist -name "*.dfu" | grep -q .; then
            echo "Build OK — .dfu produced"
          else
            echo "Build FAILED — no .dfu found" >&2
            tail -40 build.log >&2
            exit 1
          fi

      - name: Check firmware size
        if: always()
        run: |
          # Runs even if "Build firmware" failed the fbt-exit-status gate (e.g. the
          # C2-overlap packaging error from issue #9): fbt writes firmware.dfu
          # before that later packaging step runs, so the number is available and
          # worth surfacing immediately rather than waiting on a full green run to
          # find out how close (or how far) a size-trim iteration actually got.
          DFU=$(find flipper-fw/dist -name "flipper-z-f7-full-*.dfu" 2>/dev/null | head -1)
          if [ -z "$DFU" ]; then
            echo "ERROR: main firmware DFU (flipper-z-f7-full-*.dfu) not found in dist/" >&2
            find flipper-fw/dist -name "*.dfu" | sort
            exit 1
          fi
          bash shuka-edition/scripts/check_size.sh "$DFU"

      - name: Diagnose firmware size breakdown (issue #9)
        if: always()
        run: |
          # One-off diagnostic while trimming for issue #9: which linked-in
          # symbols/objects are actually the largest, so cuts can target real
          # weight instead of guessing. Non-fatal — never fails the job.
          set +e
          ELF=$(find flipper-fw/build -maxdepth 2 -name "firmware.elf" 2>/dev/null | head -1)
          NM=$(find / -xdev -name "arm-none-eabi-nm" 2>/dev/null | head -1)
          SIZE_BIN=$(find / -xdev -name "arm-none-eabi-size" 2>/dev/null | head -1)
          echo "ELF: $ELF"
          echo "nm : $NM"
          echo "size: $SIZE_BIN"
          if [ -n "$ELF" ] && [ -n "$SIZE_BIN" ]; then
            echo "=== Section sizes ==="
            "$SIZE_BIN" -A "$ELF"
          fi
          if [ -n "$ELF" ] && [ -n "$NM" ]; then
            echo "=== Top 80 largest individual symbols (.text + .rodata) ==="
            "$NM" --print-size --size-sort -C "$ELF" 2>/dev/null | tail -80

            echo ""
            echo "=== Totals by subsystem prefix (sum of every matching symbol's size) ==="
            "$NM" --print-size --size-sort -C "$ELF" 2>/dev/null > /tmp/nm_full.txt
            wc -l /tmp/nm_full.txt
            python3 shuka-edition/scripts/nm_prefix_totals.py /tmp/nm_full.txt
          fi
          exit 0

      - name: Inject NSFW animations into firmware resources pack
        run: |
          # Clone the NSFW collection (shallow, no history needed)
          git clone --depth 1 \
            https://github.com/dfwrxss/Flipper-NSFW-Animation-Collection.git \
            nsfw-anim-src

          # Find the resources.ths built by fbt
          UPDATE_DIR=$(find flipper-fw/dist -maxdepth 3 -type d -name "*update*" \
            | grep -v '\.dfu' | head -1)
          RESOURCES_THS="$UPDATE_DIR/resources.ths"

          if [ ! -f "$RESOURCES_THS" ]; then
            echo "WARNING: resources.ths not found — skipping NSFW injection"
          else
            echo "Injecting into: $RESOURCES_THS ($(du -sh "$RESOURCES_THS" | cut -f1))"
            python3 shuka-edition/scripts/inject_nsfw_anims.py \
              "$RESOURCES_THS" \
              nsfw-anim-src
            echo "resources.ths after injection: $(du -sh "$RESOURCES_THS" | cut -f1)"
          fi

          # Build SD card zip of the NSFW pack for release download.
          # Generate manifest.txt so the Flipper knows which animations to display
          # when the user manually extracts the zip into SD:/dolphin/external/.
          printf "Filetype: Flipper Animation Manifest\nVersion: 1" \
            > nsfw-anim-src/manifest.txt
          for dir in $(find nsfw-anim-src -mindepth 1 -maxdepth 1 -type d | sort); do
            name=$(basename "$dir")
            if [ -f "${dir}/meta.txt" ]; then
              printf "\n\nName: %s\nMin butthurt: 0\nMax butthurt: 18\nMin level: 1\nMax level: 30\nWeight: 3" \
                "$name" >> nsfw-anim-src/manifest.txt
            fi
          done
          printf "\n" >> nsfw-anim-src/manifest.txt
          echo "manifest.txt: $(grep -c "^Name:" nsfw-anim-src/manifest.txt) animations listed"
          mkdir -p artifacts_anim
          (cd nsfw-anim-src && zip -r ../artifacts_anim/NSFW-Shuka-animations.zip . \
            --exclude="*.md" --exclude="*.DS_Store" 2>/dev/null)
          echo "NSFW SD pack: $(du -sh artifacts_anim/NSFW-Shuka-animations.zip | cut -f1)"

          rm -rf nsfw-anim-src

      - name: Verify app/firmware API consistency
        run: |
          # Guard against the issue #8 failure mode: if the shipped .fap files were
          # built for a different firmware API *major* than the firmware itself,
          # every external app breaks at launch with "App Too Old"/"App Too New".
          # Fail loud here rather than shipping a bundle where nothing but the
          # built-in apps (Sub-GHz, Settings) works.
          UPDATE_DIR=$(find flipper-fw/dist -maxdepth 3 -type d -name "*update*" \
            | grep -v '\.dfu' | head -1)
          RESOURCES_THS="$UPDATE_DIR/resources.ths"
          API_CSV=flipper-fw/targets/f7/api_symbols.csv
          if [ ! -f "$RESOURCES_THS" ]; then
            echo "ERROR: resources.ths not found — cannot verify API consistency" >&2
            exit 1
          fi
          pip3 install -q heatshrink2
          python3 shuka-edition/scripts/check_api_consistency.py "$API_CSV" "$RESOURCES_THS"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts

          # Show what fbt actually produced so we can debug missing files
          echo "=== dist/ contents ==="
          find flipper-fw/dist -type f | sort

          # Copy DFU and any tgz fbt may have made
          find flipper-fw/dist \( -name "*.dfu" -o -name "*.tgz" \) | xargs -I{} cp {} artifacts/ 2>/dev/null || true

          # ARF's fbt does not generate update.fuf — create it manually then tar the bundle.
          UPDATE_DIR=$(find flipper-fw/dist -maxdepth 3 -type d -name "*update*" | grep -v '\.dfu' | head -1)
          if [ -n "$UPDATE_DIR" ]; then
            echo "Update directory: $UPDATE_DIR"
            ls -la "$UPDATE_DIR/"

            # Compute CRC32 of updater.bin (required by Flipper Format manifest).
            # Output is little-endian hex bytes separated by spaces (e.g. "AB CD EF 12").
            UPDATER_BIN=$(find "$UPDATE_DIR" -name "updater.bin" | head -1)
            if [ -n "$UPDATER_BIN" ]; then
              LOADER_CRC=$(python3 -c "import struct,zlib; d=open('${UPDATER_BIN}','rb').read(); print(' '.join(f'{b:02X}' for b in struct.pack('<I',zlib.crc32(d)&0xFFFFFFFF)))")
              LOADER_LINE=$'Loader: updater.bin\n'"Loader CRC: $LOADER_CRC"
            else
              echo "WARNING: updater.bin not found — omitting Loader fields"
              LOADER_LINE=""
            fi

            # Generate update.fuf in Flipper Format (not INI).
            {
              echo "Filetype: Flipper firmware upgrade configuration"
              echo "Version: 2"
              echo "Info: ARF-Shuka-Edition"
              echo "Target: 7"
              [ -n "$LOADER_LINE" ] && echo "$LOADER_LINE"
              echo "Firmware: firmware.dfu"
              # Resources must be listed so the updater deploys FAPs to the SD card
              [ -f "$UPDATE_DIR/resources.ths" ] && echo "Resources: resources.ths"
              # Include splashscreen if present
              [ -f "$UPDATE_DIR/splash.bin" ] && echo "Splashscreen: splash.bin"
            } > "$UPDATE_DIR/update.fuf"
            echo "Generated update.fuf:"
            cat "$UPDATE_DIR/update.fuf"

            # Include full resources.ths (all FAPs + dolphin animations).
            # slim_resources.py was originally added to work around qFlipper's
            # MD5 timeout, but our web flasher has no such limit. Including all
            # FAPs ensures the OTA deploys the complete app catalog without
            # wiping apps like proto_pirate, protoview, subghz_bruteforcer, etc.
            RESOURCES_THS="$UPDATE_DIR/resources.ths"
            if [ -f "$RESOURCES_THS" ]; then
              echo "resources.ths: $(du -sh "$RESOURCES_THS" | cut -f1) (full, not slimmed)"
            fi

            BUNDLE_NAME="flipper-z-f7-update-arf-shuka-edition.tgz"
            tar -czf "artifacts/${BUNDLE_NAME}" \
              --exclude='*/radio.bin' \
              -C "$(dirname "$UPDATE_DIR")" "$(basename "$UPDATE_DIR")"
            echo "Created OTA bundle: ${BUNDLE_NAME} ($(du -sh artifacts/${BUNDLE_NAME} | cut -f1))"
          else
            echo "WARNING: no update directory found in dist/ — OTA web flash will not work"
            find flipper-fw/dist -type d | sort
          fi

          # Include animation packs
          cp artifacts_anim/ARF-Shuka-animations.zip artifacts/ 2>/dev/null || true
          cp artifacts_anim/NSFW-Shuka-animations.zip artifacts/ 2>/dev/null || true
          echo "=== artifacts/ ==="
          ls -lh artifacts/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARF-Shuka-Edition-${{ github.sha }}
          path: artifacts/
          retention-days: 30

      - name: Publish OTA bundle to docs/ for same-origin web flash
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          BUNDLE=$(ls artifacts/flipper-z-f7-update-arf-shuka-edition.tgz 2>/dev/null || ls artifacts/*.tgz 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "No .tgz to publish — web flash will not work"
            exit 0
          fi
          cp "$BUNDLE" shuka-edition/docs/latest-update.tgz
          # Also publish the full DFU for the web flasher DFU recovery mode
          DFU_FULL=$(find artifacts -name "flipper-z-f7-full-*.dfu" | head -1)
          if [ -n "$DFU_FULL" ]; then
            cp "$DFU_FULL" shuka-edition/docs/latest-full.dfu
            echo "DFU published to docs/latest-full.dfu ($(du -sh shuka-edition/docs/latest-full.dfu | cut -f1))"
          fi
          # latest-build.txt: SHORT_SHA, ARF_TAG, ISO timestamp (one per line)
          printf '%s\n%s\n%s\n' \
            "${{ env.SHORT_SHA }}" \
            "${{ env.ARF_TAG }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > shuka-edition/docs/latest-build.txt
          cd shuka-edition
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest-update.tgz docs/latest-build.txt docs/flash.html docs/latest-full.dfu 2>/dev/null || true
          git commit -m "ci: publish OTA bundle ${{ env.SHORT_SHA }} [skip ci]" || echo "Nothing to commit"
          git push

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.SHORT_SHA }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.SHORT_SHA }}
          files: artifacts/*
          body: |
            ## ARF-Shuka-Edition ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.SHORT_SHA }}

            **Based on ARF:** `${{ env.ARF_TAG }}`

            ### How to install

            **Recommended — download `flipper-z-f7-update-arf-shuka-edition.tgz`**
            Open qFlipper → Install from file → select the `.tgz`
            Updates firmware + Infrared, NFC, RFID, GPIO, Bad USB, U2F apps in one step.

            **Firmware only — download `flipper-z-f7-full-arf-shuka-edition.dfu`**
            Open qFlipper → Install from file → select the `.dfu`
            Updates the firmware binary only, does not touch your SD card.

            See [README](README.md) for full instructions and protocol list.

            ### Animations
            NSFW animations are embedded in the OTA bundle and deploy automatically to `/ext/dolphin/external/` on your SD card.
            Download `NSFW-Shuka-animations.zip` if you want to manually copy them to the SD card (without flashing).
          draft: false
          prerelease: false
